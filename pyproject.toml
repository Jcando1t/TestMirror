[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "testmirror"
version = "0.3.0"
description = "LangGraph multi-agent test evaluation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    # shortcut: Windows application control blocks 1.13.1 on the acceptance host; revisit when a compatible release passes clean install.
    "ormsgpack==1.12.0; sys_platform == 'win32'",
    "langchain>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.32,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".env.example",
    ".gitignore",
    "README.md",
    "config",
    "docs/guides/web-evaluation-复验说明.md",
    "examples",
    "pyproject.toml",
    "requirements.txt",
    "scripts/validate_workflow.py",
    "src",
    "tests",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
